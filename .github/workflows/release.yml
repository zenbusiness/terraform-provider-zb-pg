# Publish a tag of this private repository.
#
# Pushing a tag that matches v* (for example v1.26.0-zb.1) builds and signs
# the provider with GoReleaser, creates a GitHub Release, and uploads that
# release to the HCP Terraform private registry.
#
# This workflow belongs only in the private repository. Do not push it to
# zenbusiness/terraform-provider-postgresql-contrib.
#
# Repository variable:
#   HCP_TERRAFORM_ORGANIZATION  HCP Terraform organization. The repository is
#                               created with the placeholder REPLACE_ME.
#                               Publishing fails until it is replaced.
#   HCP_TERRAFORM_HOSTNAME      Optional. Defaults to app.terraform.io.
#
# Secrets, preferably on the publish environment:
#   GPG_PRIVATE_KEY             ASCII-armored private key used to sign checksums.
#   PASSPHRASE                  Passphrase for that key.
#   HCP_TERRAFORM_TOKEN         Token for a team that can manage the private registry.
#
# Tag versions must not reuse an upstream release version. A rebuilt upstream
# v1.26.0 has different checksums than the public provider.
#
name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      -
        name: Check release configuration
        env:
          HCP_TERRAFORM_ORGANIZATION: ${{ vars.HCP_TERRAFORM_ORGANIZATION }}
          HCP_TERRAFORM_TOKEN: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          missing=0
          if [ -z "${HCP_TERRAFORM_ORGANIZATION}" ] || [ "${HCP_TERRAFORM_ORGANIZATION}" = "REPLACE_ME" ]; then
            echo "Set the HCP_TERRAFORM_ORGANIZATION repository variable. It is still empty or REPLACE_ME."
            missing=1
          fi
          for name in HCP_TERRAFORM_TOKEN GPG_PRIVATE_KEY PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: ${name}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Unshallow
        run: git fetch --prune --unshallow
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      -
        name: Import GPG key
        id: import_gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: bash .github/scripts/import-gpg.sh
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-hcp:
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: publish
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --dir dist --clobber
      -
        name: Import GPG key
        id: import_gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: bash .github/scripts/import-gpg.sh
      -
        name: Publish to HCP Terraform
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_KEY_ID: ${{ steps.import_gpg.outputs.keyid }}
          HCP_TERRAFORM_TOKEN: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          HCP_TERRAFORM_ORGANIZATION: ${{ vars.HCP_TERRAFORM_ORGANIZATION }}
          HCP_TERRAFORM_HOSTNAME: ${{ vars.HCP_TERRAFORM_HOSTNAME }}
        run: python3 .github/scripts/publish_hcp_provider.py
